site:
  name: MAINFRAME-7 Terminal
  site: 'https://example.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: MAINFRAME-7 Terminal
    template: '%s | MAINFRAME-7 Terminal'
  description: 'A retro terminal-themed site and web app template built with Astro.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: MAINFRAME-7 Terminal
    type: website
  twitter:
    handle: '@example'
    site: '@example'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'blog/category' # Category pages: /blog/category/some-category
      robots:
        index: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  projects:
    isEnabled: true
    projectsPerPage: 12

    project:
      isEnabled: true
      permalink: '/projects/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'projects' # Projects main path
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'projects/category' # Category pages: /projects/category/some-category
      robots:
        index: true

    isRelatedProjectsEnabled: false

# Template persona, theme default, effects and integrations.
# Every field here is optional - configBuilder fills in defaults for anything omitted.
# See vendor/integration/utils/configBuilder.ts for the full typed shape (TEMPLATE export).
template:
  identity:
    name: Ada Operator
    handle: ada
    org: MAINFRAME-7 Systems
    role: Systems Developer
    tagline: 'Building steady systems, one terminal command at a time.'
    location: 'Sector 7, Grid North'

  social:
    - label: GitHub
      href: 'https://github.com/example'
      icon: tabler:brand-github
    - label: X
      href: 'https://x.com/example'
      icon: tabler:brand-x
    - label: RSS
      href: '/rss.xml'
      icon: tabler:rss

  themes:
    default: green # Values: "green" | "amber" | "red" | "yellow" | "blue" (see src/lib/themes.ts)

  effects:
    boot: true
    noise: true
    scanline: true
    overlay: true
    decoder: true

  shell:
    prompt: 'guest@mainframe-7:~$'
    motd: 'Type help to list commands.'

  integrations:
    forms:
      provider: web3forms
      accessKey: null
    gtm:
      id: null
    ga:
      id: null
